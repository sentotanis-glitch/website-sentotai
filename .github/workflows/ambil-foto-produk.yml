name: Ambil foto produk (sekali pakai)

on:
  push:
    branches: ['arena/01a0fd1a-website-sentotai']
    paths:
      - '.github/workflows/ambil-foto-produk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ambil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unduh foto produk
        run: |
          set -e
          mkdir -p assets/img/cicha
          while IFS='|' read -r nama url; do
            [ -z "$nama" ] && continue
            curl -fsSL --retry 3 --max-time 60 -A "Mozilla/5.0" "$url" -o "assets/img/cicha/$nama.jpg"
            file "assets/img/cicha/$nama.jpg"
          done <<'DAFTAR'
          misschique-encapsulated-retinol-serum|https://www.tokocicha.my.id/uploads/misschique-encapsulated-retinol-serum.jpg
          misschique-peeling-serum|https://www.tokocicha.my.id/uploads/misschique-peeling-serum.jpg
          ichiboss-papaya-brightening-soap|https://www.tokocicha.my.id/uploads/ichiboss-papaya-brightening-soap.jpg
          ichiboss-tea-tree-acne-care-soap|https://www.tokocicha.my.id/uploads/ichiboss-tea-tree-acne-care-soap.jpg
          bavvoc-feminine-spray-bubble-gum|https://www.tokocicha.my.id/uploads/bavvoc-feminine-spray-bubble-gum.jpg
          bavvoc-feminine-spray-strawberry|https://www.tokocicha.my.id/uploads/bavvoc-feminine-spray-strawberry.jpg
          bavvoc-feminine-spray-vanilla|https://www.tokocicha.my.id/uploads/bavvoc-feminine-spray-vanilla.jpg
          bavvoc-pure-essence-feminine-wash|https://www.tokocicha.my.id/uploads/bavvoc-pure-essence-feminine-wash.jpg
          bavvoc-lumi-veil|https://www.tokocicha.my.id/uploads/bavvoc-lumi-veil.jpg
          optimo-toilet-cleaner|https://www.tokocicha.my.id/u/1a481592388ec6b5.jpg
          optimo-oxi-bleach|https://www.tokocicha.my.id/uploads/optimo-oxi-bleach-500gr.jpg
          optimo-multi-spray-perfume|https://www.tokocicha.my.id/uploads/optimo-multi-spray-perfume-60ml.jpg
          optimo-multi-cleaner|https://www.tokocicha.my.id/uploads/optimo-multi-cleaner-100ml.jpg
          DAFTAR
          ls -la assets/img/cicha

      - name: Simpan ke cabang ini
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/cicha
          if git diff --cached --quiet; then
            echo "Tidak ada foto baru."
          else
            git commit -m "Tambah foto produk Cicha (otomatis)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
