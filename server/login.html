<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#0b3d2e">
<title>Masuk Admin — SENTOT AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b3d2e'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='24' font-weight='700' fill='%23e0be55' text-anchor='middle'%3ESAI%3C/text%3E%3C/svg%3E">
<style>
[hidden]{display:none!important}
:root{color-scheme:light;--green:#0b3d2e;--gold:#b59137;--ink:#20362b}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#f7f4ed;color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
.top{padding:23px 6vw;border-bottom:1px solid #e7e4da;display:flex;gap:11px;align-items:center}
.mark{display:grid;place-items:center;width:43px;height:43px;border-radius:12px;background:var(--green);border:1px solid #a58b3f;color:#e0be55;font:700 16px Georgia,serif}
.brand b{display:block;font:700 15px Georgia,serif;letter-spacing:.03em}.brand small{font-size:10px;letter-spacing:.19em;color:#788074}
main{width:100%;max-width:490px;margin:auto;padding:50px 22px}.card{padding:34px;background:white;border:1px solid #e3e6dd;border-radius:22px;box-shadow:0 12px 40px #163a2710}
.lock{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:#eff5ef;color:var(--green);margin-bottom:20px}
.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#8a7030;font-weight:750;margin:0 0 8px}
h1{font:600 30px/1.2 Georgia,serif;letter-spacing:-.02em;margin:0 0 10px}p{margin:0 0 22px;color:#6a746b;font-size:14px}
label{display:block;font-size:13px;font-weight:650;margin-bottom:8px}.password{position:relative;margin-bottom:18px}
input{font:inherit;font-size:16px;width:100%;height:49px;padding:11px 82px 11px 14px;border:1px solid #ccd4cb;border-radius:10px;color:var(--ink);background:#fff;outline:none}
input:focus{border-color:var(--green);box-shadow:0 0 0 3px #0b3d2e17}
button{font:inherit;cursor:pointer}.show{position:absolute;right:5px;top:5px;height:39px;padding:0 10px;border:0;background:none;color:#526a57;font-size:12px;border-radius:7px}.show:hover{background:#eff5ef}
.submit{border:0;border-radius:10px;background:var(--green);color:white;width:100%;min-height:48px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:8px}.submit:hover{background:#135c43}.submit:disabled{opacity:.65;cursor:wait}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.note{margin:18px 0 0;font-size:12px;color:#7c857d;text-align:center}.back{display:block;text-align:center;font-size:13px;margin:23px auto 0;color:#546b59;text-decoration:none}.back:hover{text-decoration:underline}
.alert{padding:12px 14px;border-radius:10px;background:#fff3ed;border:1px solid #efc6b6;color:#8d3e24;font-size:13px;margin:0 0 20px;overflow-wrap:anywhere}
footer{text-align:center;padding:0 20px 25px;color:#858c82;font-size:11px}.hidden{display:none}
@media(max-width:430px){main{padding:32px 18px}.card{padding:26px 22px}.top{padding:18px 22px}h1{font-size:28px}}
</style>
</head>
<body>
<header class="top"><span class="mark">SAI</span><div class="brand"><b>SENTOT AI</b><small>SOFIA COLLECTION</small></div></header>
<main>
<section class="card" aria-labelledby="login-title">
<div class="lock"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></div>
<p class="eyebrow">Ruang pengelola website</p>
<h1 id="login-title">Masuk Admin</h1>
<p>Masukkan password untuk mengelola toko dan layanan Anda.</p>
<!--MESSAGE-->
<form id="loginForm" method="post" action="/api/admin?action=login">
<input type="hidden" name="csrf" value="<!--CSRF-->">
<label for="password">Password admin</label>
<div class="password"><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="512" spellcheck="false" autocapitalize="none" aria-describedby="login-note"><button type="button" class="show" id="showPassword" aria-controls="password" aria-pressed="false">Lihat</button></div>
<button class="submit" id="submitButton" type="submit">Masuk ke Panel <span aria-hidden="true">→</span></button>
</form>
<p class="note" id="login-note">Spasi di awal atau akhir password diabaikan. Sesi berlaku 1 jam — klik Keluar setelah selesai.</p>
</section>
<a class="back" href="/">← Kembali ke website toko</a>
</main>
<footer>Panel pengelola · SENTOT AI × SOFIA COLLECTION</footer>
<script>
// Remove only legacy browser credentials; draft product data is kept.
try{const v=JSON.parse(localStorage.getItem('sa_gh_v1')||'{}');if(v.token){delete v.token;localStorage.setItem('sa_gh_v1',JSON.stringify(v))}}catch(_){}
const p=document.getElementById('password'),s=document.getElementById('showPassword');
s.addEventListener('click',()=>{const visible=p.type==='password';p.type=visible?'text':'password';s.textContent=visible?'Sembunyikan':'Lihat';s.setAttribute('aria-pressed',String(visible));p.focus()});
document.getElementById('loginForm').addEventListener('submit',()=>{const b=document.getElementById('submitButton');b.disabled=true;b.textContent='Memeriksa…'});
</script>
</body>
</html>
